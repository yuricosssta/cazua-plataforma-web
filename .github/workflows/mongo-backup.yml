name: MongoDB Backup to R2

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  BACKUP_PREFIX: "backups/mongo/"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backup Docker Image
        run: docker build -t cazu-mongo-backup -f BackEnd/Dockerfile.backup BackEnd/

      - name: Execute Backup Script
        id: run_backup
        run: |
          mkdir -p ./backup-artifacts
          docker run --rm \
            -e MONGO_URI="${MONGO_URI}" \
            -e R2_ENDPOINT="${R2_ENDPOINT}" \
            -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
            -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
            -e R2_BUCKET_NAME="${R2_BUCKET_NAME}" \
            -e BACKUP_PREFIX="${BACKUP_PREFIX}" \
            -e GITHUB_ACTIONS="true" \
            -e RUNNER_TEMP="/export" \
            -v ${{ github.workspace }}/backup-artifacts:/export \
            cazu-mongo-backup /app/scripts/backup-mongo.sh
          
          # Captura o nome do arquivo gerado a partir do diretório exportado
          ARCHIVE_NAME=$(ls ./backup-artifacts | grep .tar.gz | head -n 1)
          echo "artifact_path=./backup-artifacts/${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload local artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongo-backup-${{ github.run_id }}
          path: ${{ steps.run_backup.outputs.artifact_path }}
          retention-days: 7