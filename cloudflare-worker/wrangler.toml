# cloudflare-worker/wrangler.toml
name = "cazua-tenant-router"
main = "worker.js"
compatibility_date = "2024-08-25"
compatibility_flags = ["nodejs_compat"]

# Variáveis de ambiente (não-sensíveis)
[vars]
CF_ZONE_ID = "2d7f309d05280aac75a42614147625a0"

# Routes — garante que o Worker é o handler oficial
# (a rota também é configurada no Dashboard; versionar aqui é boa prática)
[[routes]]
pattern = "*.grupocazua.com.br/*"
zone_name = "grupocazua.com.br"

# Secrets (configurar via: wrangler secret put <NOME>)
# - ROOT_DOMAIN       # grupocazua.com.br
# - APP_DOMAIN        # www.grupocazua.com.br
# - VERCEL_ORIGIN     # vanguardatech.vercel.app
# - PURGE_TOKEN       # Token Bearer para autorizar /__purge
# - CF_API_TOKEN      # API Token do Cloudflare com permissão Zone.Cache Purge:Edit
